name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, migrate, test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: edutou
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: edutou_test
        ports:
          - 5432:5432
        # Without this the job races the database's first boot.
        options: >-
          --health-cmd "pg_isready -U edutou -d edutou_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://edutou:testpw@localhost:5432/edutou_test
      JWT_SECRET: ci-secret-long-enough-for-hs256-abcdefghijklmnop
      STORAGE_DIR: ./.test-uploads
      PUBLIC_URL: http://127.0.0.1:4000
      FRONTEND_URL: http://127.0.0.1:3000
      CORS_ORIGINS: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # The backend compiles under `strict` with no ignoreBuildErrors escape
        # hatch, so a type error fails the build here rather than at runtime.
        run: npm run typecheck

      - name: Apply migrations
        run: npm run migrate

      - name: Verify migrations are idempotent
        # A second run must apply nothing. Catches a migration that is not
        # actually re-runnable, or a checksum that changed since it was applied.
        run: npm run migrate

      - name: Run tests
        # `npm test` sets --test-concurrency=1. The suites share one database
        # and each truncates it between tests, so a parallel run has one file
        # deleting another's fixtures mid-test.
        run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: edutou-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        # Proves the image boots, connects to Postgres, applies migrations and
        # serves traffic -- not just that it compiled.
        run: |
          docker network create edutou-ci
          docker run -d --name db --network edutou-ci \
            -e POSTGRES_USER=edutou -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=edutou \
            postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U edutou -d edutou && break
            sleep 2
          done
          docker run -d --name api --network edutou-ci -p 4000:4000 \
            -e DATABASE_URL=postgres://edutou:testpw@db:5432/edutou \
            -e JWT_SECRET=ci-secret-long-enough-for-hs256-abcdefghijklmnop \
            -e PUBLIC_URL=http://localhost:4000 \
            -e FRONTEND_URL=http://localhost:3000 \
            -e CORS_ORIGINS=http://localhost:3000 \
            edutou-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4000/health/ready; then
              echo "\nAPI is ready"
              exit 0
            fi
            sleep 2
          done
          echo "API failed to become ready:"
          docker logs api
          exit 1

  deploy:
    name: Trigger Dokploy deploy
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Call Dokploy deploy webhook
        # Add DOKPLOY_BACKEND_DEPLOY_URL as a repository secret. Dokploy shows
        # this URL under the application's Deployments -> Webhook section.
        # If the secret is absent the step is skipped rather than failing, so
        # forks and first-time setups do not see a red build.
        env:
          DEPLOY_URL: ${{ secrets.DOKPLOY_BACKEND_DEPLOY_URL }}
        run: |
          if [ -z "$DEPLOY_URL" ]; then
            echo "DOKPLOY_BACKEND_DEPLOY_URL not set -- skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$DEPLOY_URL"
          echo "Deploy triggered."
